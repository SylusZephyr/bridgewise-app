<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>BridgeWise promo</title>
<style>
  :root { --navy:#05091a; --ink:#f6f7fb; --blue:#2f6bff; --violet:#7c4dff; --cyan:#3fd0ff; --ok:#3ccf91; --muted:#9fb0d6; }
  * { box-sizing:border-box; margin:0; }
  html,body { width:1920px; height:1080px; overflow:hidden; background:var(--navy); color:var(--ink); font-family:'Segoe UI Variable Display','Segoe UI',system-ui,sans-serif; }
  #bg { position:absolute; inset:0; overflow:hidden; }
  .blob { position:absolute; border-radius:50%; filter:blur(110px); opacity:.6; animation:drift 12s ease-in-out infinite alternate; }
  .b1 { width:1000px; height:1000px; background:#1d3fbf; left:-250px; top:-300px; }
  .b2 { width:900px; height:900px; background:#5a2fd6; right:-300px; bottom:-350px; animation-delay:-4s; }
  .b3 { width:600px; height:600px; background:#0b8fc9; left:42%; top:52%; opacity:.35; animation-delay:-8s; }
  @keyframes drift { to { transform:translate(180px,90px) scale(1.18); } }
  #grid { position:absolute; inset:-100px; background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px); background-size:80px 80px; animation:pan 8s linear infinite; mask-image:radial-gradient(70% 70% at 50% 50%,#000,transparent); }
  @keyframes pan { to { transform:translate(80px,80px); } }
  #bar { position:absolute; left:0; top:0; height:6px; background:linear-gradient(90deg,var(--cyan),var(--violet)); width:0; }
  .scene { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; flex-direction:column; will-change:opacity,transform; }
  .word { display:inline-block; opacity:0; transform:translateY(60px) scale(.96); animation:up .55s cubic-bezier(.15,.9,.2,1) forwards; }
  .slam { display:inline-block; opacity:0; transform:scale(1.8); animation:slam .45s cubic-bezier(.2,.9,.2,1) forwards; }
  @keyframes up { to { opacity:1; transform:none; } }
  @keyframes slam { 60% { opacity:1; } to { opacity:1; transform:none; } }
  .big { font-size:128px; font-weight:850; letter-spacing:-5px; line-height:1; text-align:center; }
  .hot { color:#ff6b6b; }
  .gradw .word, .gradw .slam, b.grad { background:linear-gradient(90deg,#8fb0ff,#ffffff 45%,#c6b4ff); -webkit-background-clip:text; background-clip:text; color:transparent; padding-bottom:.08em; }
  .eyebrow { font-size:26px; letter-spacing:10px; text-transform:uppercase; color:var(--cyan); font-weight:800; margin-bottom:34px; opacity:0; animation:up .5s .05s forwards; }
  .mark { width:220px; height:220px; border-radius:58px; background:none; display:grid; place-items:center; font-size:92px; font-weight:900; box-shadow:0 30px 140px rgba(91,140,255,.65); transform:scale(0) rotate(-25deg); animation:logo .8s cubic-bezier(.2,1.5,.3,1) forwards; }
  @keyframes logo { to { transform:none; } }
  .ring { position:absolute; width:220px; height:220px; border-radius:50%; border:4px solid rgba(143,176,255,.7); animation:ring 1.2s .15s ease-out forwards; opacity:0; }
  @keyframes ring { 0% { opacity:1; transform:scale(.6);} 100% { opacity:0; transform:scale(5);} }
  .name { font-size:160px; font-weight:900; letter-spacing:-7px; margin-top:40px; }
  /* agent */
  .agent { display:grid; grid-template-columns:860px 600px; gap:70px; align-items:center; }
  .chat { background:rgba(8,15,36,.82); border:1px solid rgba(255,255,255,.14); border-radius:32px; padding:36px; box-shadow:0 40px 140px rgba(0,0,0,.55); }
  .chat-h { display:flex; gap:16px; align-items:center; font-size:30px; font-weight:800; margin-bottom:24px; }
  .av { width:56px; height:56px; border-radius:16px; background:linear-gradient(135deg,#5b8cff,#7c4dff); display:grid; place-items:center; font-size:28px; }
  .live { margin-left:auto; font-size:20px; font-weight:700; color:var(--ok); display:flex; align-items:center; gap:8px; }
  .live::before { content:''; width:12px; height:12px; border-radius:50%; background:var(--ok); box-shadow:0 0 0 0 rgba(60,207,145,.7); animation:beat 1s infinite; }
  @keyframes beat { to { box-shadow:0 0 0 14px rgba(60,207,145,0); } }
  .msg { font-size:28px; padding:18px 24px; border-radius:20px; margin:12px 0; opacity:0; animation:up .45s forwards; max-width:92%; }
  .msg.user { background:var(--blue); margin-left:auto; }
  .msg.bot { background:rgba(255,255,255,.08); }
  .call { font-family:'Cascadia Code',Consolas,monospace; font-size:25px; display:flex; align-items:center; gap:14px; padding:13px 18px; margin:9px 0; border-radius:14px; background:rgba(63,208,255,.08); border:1px solid rgba(63,208,255,.3); opacity:0; transform:translateX(-40px); animation:slide .35s cubic-bezier(.2,.9,.2,1) forwards; }
  .call b { color:var(--cyan); font-weight:600; }
  .call .r { color:#9fb0d6; }
  .call .ok { margin-left:auto; color:var(--ok); font-weight:800; opacity:0; animation:pop .3s forwards; }
  @keyframes slide { to { opacity:1; transform:none; } }
  @keyframes pop { from { opacity:0; transform:scale(.6);} to { opacity:1; transform:none; } }
  .side h2 { font-size:92px; font-weight:850; letter-spacing:-4px; line-height:1; }
  .side p { font-size:30px; color:var(--muted); margin-top:24px; line-height:1.4; opacity:0; animation:up .6s .9s forwards; }
  .pill { display:inline-block; font-size:22px; font-weight:800; letter-spacing:5px; text-transform:uppercase; padding:10px 20px; border-radius:999px; background:rgba(63,208,255,.14); color:var(--cyan); margin-bottom:26px; }
  /* footage */
  .shot { position:absolute; left:120px; top:150px; width:1200px; height:750px; border-radius:24px; background:#0b1430; box-shadow:0 50px 160px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.14); }
  .label { position:absolute; left:1390px; top:300px; width:430px; }
  .label .k { font-size:22px; font-weight:800; letter-spacing:6px; text-transform:uppercase; color:var(--cyan); opacity:0; animation:up .5s .2s forwards; }
  .label h3 { font-size:64px; font-weight:850; letter-spacing:-2px; line-height:1.02; margin-top:18px; opacity:0; animation:up .6s .35s forwards; }
  .label p { font-size:26px; color:var(--muted); margin-top:20px; line-height:1.4; opacity:0; animation:up .6s .6s forwards; }
  .fine { position:absolute; left:120px; bottom:56px; font-size:19px; color:#6f84b8; }
  /* approve */
  .approval { width:920px; background:#fbfcff; color:#0e1726; border-radius:30px; padding:42px 50px; box-shadow:0 60px 160px rgba(0,0,0,.55); opacity:0; transform:translateY(80px) scale(.94); animation:card .7s cubic-bezier(.2,.9,.2,1) forwards; position:relative; }
  @keyframes card { to { opacity:1; transform:none; } }
  .approval h3 { font-size:42px; font-weight:850; }
  .row { display:flex; justify-content:space-between; font-size:29px; padding:14px 0; border-bottom:1px solid #e3e8ef; }
  .row span:first-child { color:#5b6576; }
  .btns { display:flex; gap:18px; margin-top:28px; }
  .btn { font-size:29px; font-weight:800; padding:18px 38px; border-radius:16px; background:#e9eef7; }
  .btn.primary { background:#0b5cff; color:#fff; animation:press .9s 1.2s forwards; }
  @keyframes press { 35% { transform:scale(.92);} 70% { transform:scale(1.03); background:#0e8a5f; } 100% { transform:none; background:#0e8a5f; } }
  .hash { font-family:Consolas,monospace; font-size:21px; color:#8a94a6; margin-top:22px; }
  .seal { position:absolute; right:-46px; top:-46px; width:150px; height:150px; border-radius:50%; background:#0e8a5f; color:#fff; display:grid; place-items:center; font-size:70px; transform:scale(0); animation:logo .5s 1.8s cubic-bezier(.2,1.6,.3,1) forwards; box-shadow:0 20px 70px rgba(14,138,95,.6); }
  /* features */
  .feats { display:grid; grid-template-columns:repeat(2,700px); gap:30px; }
  .feat { height:190px; border-radius:30px; padding:36px 40px; background:linear-gradient(160deg,rgba(255,255,255,.11),rgba(255,255,255,.03)); border:1px solid rgba(255,255,255,.14); opacity:0; transform:translateY(50px) scale(.95); animation:pop2 .5s cubic-bezier(.2,.9,.3,1.2) forwards; display:flex; gap:30px; align-items:center; }
  @keyframes pop2 { to { opacity:1; transform:none; } }
  .feat i { font-style:normal; font-size:64px; width:100px; text-align:center; }
  .feat b { font-size:44px; display:block; }
  .feat span { font-size:24px; color:var(--muted); }
  /* stats */
  .stats { display:flex; gap:110px; }
  .stat { text-align:center; opacity:0; animation:pop2 .5s forwards; }
  .stat b { display:block; font-size:200px; font-weight:900; letter-spacing:-8px; line-height:1; }
  .stat span { font-size:32px; color:var(--muted); }
  .url { margin-top:46px; font-size:40px; font-weight:800; padding:18px 36px; border-radius:999px; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.2); opacity:0; animation:up .6s 1s forwards; }
  .sub { font-size:40px; color:var(--muted); margin-top:26px; opacity:0; animation:up .6s .55s forwards; }
  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
</style></head>
<body>
<div id="bg"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="grid"></div></div>
<div id="stage"></div><div id="bar"></div><div id="flash"></div>
<script>
const W = (t, d0 = 0, step = 0.11, cls = 'word') => t.split(' ').map((w, i) => `<span class="${cls}" style="animation-delay:${(d0 + i * step).toFixed(2)}s">${w}</span>`).join(' ');
const SHOT = (k, h, p) => `<div class="shot"></div><div class="label"><div class="k">${k}</div><h3>${h}</h3><p>${p}</p></div><div class="fine">Recorded in BridgeWise · Alipay open-platform sandbox and Stripe test mode</div>`;
const SCENES = {
  hook: () => `<div class="big">${W('Your tuition is due.', 0.05)}<br>${W('Your rupees are losing value.', 1.9, 0.1)}<br><span class="hot">${W('Your bank hides the fee.', 4.2, 0.12, 'slam')}</span></div>`,
  pain: () => `<div class="big gradw" style="font-size:150px">${W('Two currencies.', 0.05, 0.1, 'slam')}<br>${W('One deadline.', 1.5, 0.1, 'slam')}<br>${W('Zero room for error.', 2.9, 0.1, 'slam')}</div>`,
  logo: () => `<div class="ring"></div><div class="mark"><img src="logo.svg" style="width:100%;height:100%;display:block"></div><div class="name gradw">${W('BridgeWise', 0.35, 0.1)}</div>`,
  agent: () => `<div class="agent"><div class="chat"><div class="chat-h"><div class="av">✦</div>BridgeWise Agent<span class="live">tool calls</span></div>
      <div class="msg user" style="animation-delay:.3s">Pay my Tsinghua tuition invoice</div>
      ${[['read_invoice', 'CNY 26,000 · due 15 Dec'], ['get_overview', '3 pockets · reserve kept'], ['get_fx', 'ECB live rate'], ['compare_live_providers', '17 providers quoted'], ['propose_bill_payment', 'card ready']]
        .map(([n, r], i) => `<div class="call" style="animation-delay:${2.2 + i * 2.1}s"><span>⚙</span><b>${n}</b><span class="r">${r}</span><span class="ok" style="animation-delay:${2.9 + i * 2.1}s">✓</span></div>`).join('')}
      <div class="msg bot" style="animation-delay:12.8s">Ready: approve the card to set CNY 26,000 aside.</div></div>
      <div class="side"><div class="pill">Agentic AI</div><h2>${W('Paste it. The agent does the rest.', 0.4, 0.09)}</h2><p>Real tool calls: invoice, balances, live rates, 17 providers, a payment ready to approve.</p></div></div>`,
  card: () => SHOT('Real rails · Stripe', 'Top up by card.', 'The card field is Stripe’s own: the number never reaches BridgeWise. Credited only after Stripe confirms.'),
  proposal: () => SHOT('The agent proposes', 'Every term, on one card.', 'Read from the invoice, priced at the live rate, checked against the money you live on.'),
  approve: () => `<div class="eyebrow">You approve. Nothing else.</div><div class="approval"><h3>Set aside 26,000.00 CNY for Tsinghua</h3>
      <div class="row"><span>From</span><span>CNY pocket</span></div><div class="row"><span>Reference</span><span>2026080123</span></div><div class="row"><span>Left to live on</span><span>3,200.00 CNY</span></div>
      <div class="btns"><div class="btn primary">✓ Approve</div><div class="btn">Decline</div></div><div class="hash">sha256 9f2c41e8a7… · nothing moves until you approve</div><div class="seal">✓</div></div>`,
  sent: () => SHOT('Real rails · Alipay', 'Paid into Alipay.', 'Alipay’s transfer API pays the account in China. Your password confirms every payout.'),
  features: () => `<div class="feats">${[['💱', 'Every currency', 'Live ECB rates, fees shown first'], ['🎓', 'Every bill', 'Tuition set aside so it’s never spent'], ['📊', 'Your budget', 'Spending, runway, alerts'], ['🏦', 'Your credit in China', '征信 · 芝麻信用 · 微信支付分']]
      .map(([e, a, b], i) => `<div class="feat" style="animation-delay:${0.15 + i * 1.3}s"><i>${e}</i><div><b>${a}</b><span>${b}</span></div></div>`).join('')}</div>`,
  secure: () => `<div class="eyebrow">Built like a bank</div><div class="stats">${[['269', 'automated tests'], ['37', 'attack tests'], ['0', 'actions without you']]
      .map(([n, l], i) => `<div class="stat" style="animation-delay:${0.15 + i * 1.4}s"><b class="grad" data-to="${n}" data-at="${0.15 + i * 1.4}">0</b><span>${l}</span></div>`).join('')}</div>`,
  end: () => `<div class="mark" style="width:170px;height:170px;border-radius:46px;font-size:70px"><img src="logo.svg" style="width:100%;height:100%;display:block"></div><div class="name gradw" style="font-size:140px;margin-top:30px">${W('BridgeWise', 0.25)}</div>
      <div class="sub">Money across borders. Handled.</div><div class="url">bridgewise-azure.vercel.app</div>`,
};
const FLASH = new Set(['logo', 'agent', 'card', 'approve', 'sent', 'end']);
let plan = [], total = 0;
const live = new Map();
window.setup = (schedule, len) => { plan = schedule; total = len; };
const clamp = (x) => Math.max(0, Math.min(1, x));
const ease = (x) => 1 - Math.pow(1 - x, 3);
/** Draws the frame at time t (seconds): which scenes exist, and every animation's position. */
window.seek = (t) => {
  for (const s of plan) {
    const visible = t >= s.at && t < s.at + s.dur + 0.45;
    let el = live.get(s.id);
    if (visible && !el) { el = document.createElement('div'); el.className = 'scene'; el.innerHTML = SCENES[s.id](); document.getElementById('stage').appendChild(el); live.set(s.id, el); }
    if (!visible && el) { el.remove(); live.delete(s.id); continue; }
    if (!el) continue;
    const local = t - s.at;
    const inP = ease(clamp(local / 0.45)), outP = clamp((local - s.dur) / 0.45);
    el.style.opacity = String(inP * (1 - outP));
    el.style.transform = `scale(${(1.05 - 0.05 * inP) - 0.04 * outP})`;
    for (const a of el.getAnimations({ subtree: true })) { a.pause(); a.currentTime = local * 1000; }
    el.querySelectorAll('[data-to]').forEach((b) => { const p = ease(clamp((local - Number(b.dataset.at) - 0.2) / 1.3)); b.textContent = Math.round(Number(b.dataset.to) * p); });
  }
  for (const a of document.getElementById('bg').getAnimations({ subtree: true })) { a.pause(); a.currentTime = t * 1000; }
  const f = plan.filter((s) => FLASH.has(s.id) && t >= s.at && t < s.at + 0.35).length ? 1 - clamp((t - plan.find((s) => FLASH.has(s.id) && t >= s.at && t < s.at + 0.35).at) / 0.35) : 0;
  document.getElementById('flash').style.opacity = String(f * 0.5);
  document.getElementById('bar').style.width = `${(t / total) * 100}%`;
};
</script>
</body></html>
